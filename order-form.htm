<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>n33dabikini</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="form.css" />
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>

		<section class="main__wrapper">
			<h1>neeedabikini.com</h1>
			<form
			action=""
				method="POST"
			>
				<div class="input--text">
					<span>
						<label for="name">Name</label>
						<input required type="text" id="name" name="name" />
					</span>
					<span
						><label for="email">Email</label>
						<input required type="email" id="email" name="email"
					/></span>
				</div>

				<div class="input--radio">
					<p>What are you looking for?</p>
					<span
						><input value="Top" type="radio" id="bikini-top" name="selection" />
						<label for="bikini-top">Top</label></span
					>
					<span
						><input
							value="Bottom"
							type="radio"
							id="bikini-bottom"
							name="selection"
						/>
						<label for="bikini-bottom">Bottom</label></span
					>
					<span
						><input
							value="Top + Bottom"
							type="radio"
							id="bikini-top-bottom"
							name="selection"
						/>
						<label for="bikini-top-bottom">Top + Bottom</label></span
					>
				</div>

				<div class="input--radio">
					<p>Top size:</p>
					<span>
						<input value="Tiny" type="radio" id="top-tiny" name="top-size" />
						<label for="top-tiny">Tiny</label>
					</span>
					<span>
						<input value="A cup" type="radio" id="top-a" name="top-size" />
						<label for="top-a">A cup</label>
					</span>
					<span
						><input value="B cup" type="radio" id="top-b" name="top-size" />
						<label for="top-b">B cup</label></span
					>
					<span>
						<input value="C cup" type="radio" id="top-c" name="top-size" />
						<label for="top-c">C cup</label></span
					>
					<span
						><input
							value="other - "
							type="radio"
							id="top-other"
							name="top-size"
						/>
						<label for="top-other">Other</label>
					</span>
				</div>

				<div class="input--radio">
					<p>Coverage:</p>
					<span>
						<input
							value="Cheeky"
							type="radio"
							id="coverage-cheeky"
							name="coverage"
						/>
						<label for="coverage-cheeky">Cheeky</label>
					</span>
					<span>
						<input
							value="Tanga"
							type="radio"
							id="coverage-tanga"
							name="coverage"
						/>
						<label for="coverage-tanga">Tanga</label>
					</span>
					<span>
						<input
							value="Medium"
							type="radio"
							id="coverage-med"
							name="coverage"
						/>
						<label for="coverage-med">Medium</label>
					</span>
					<span
						><input
							value="Lots"
							type="radio"
							id="coverage-full"
							name="coverage"
						/>
						<label for="coverage-full">Lots</label></span
					>
				</div>
				<div class="input--text">
					<label for="hip-measurement"
						>What is your hip measurement &#10141; (xs, s, m, l, xl) or size in
						inches:
						<ul>
							<li>
								Every bikini has long strings to tie the sides making the
								bottoms flexible and adjustable.
							</li>
						</ul>
					</label>
					<input type="text" id="hip-measurement" name="hip-size" />
				</div>
				<div class="input--radio">
					<p>Colour:</p>
					<span>
						<input value="Black" type="radio" id="color-black" name="colour" />
						<label for="color-black">Black</label>
					</span>
					<span>
						<input value="Brown" type="radio" id="color-brown" name="colour" />
						<label for="coverage-brown">Brown</label>
					</span>
					<span>
						<input value="Pink" type="radio" id="color-pink" name="colour" />
						<label for="color-pink">Pink</label>
					</span>
					<span
						><input value="Other" type="radio" id="color-other" name="colour" />
						<label for="color-other">Other</label></span
					>
				</div>
				<div class="input--text">
					<label for="shipping"
						>Shipping location:
						<ul>
							<li>Pick up will be coordinated together.</li>
						</ul>
					</label>
					<input required type="text" id="shipping" name="shipping" />
				</div>
				<div class="input--text">
					<label for="comments"
						>Additional comments:
						<ul>
							<li>Feel free to add anything else you think is important to know.</li>
						</ul>
					</label>
					<textarea maxlength="150" rows="2" id="comments" name="comments"></textarea>
				</div>
				<button type="submit" value="Submit">Place Your Order <3</button>
			</form>
		</section>
	</body>
</html>
